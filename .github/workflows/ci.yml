name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    env:
      # prisma generate só lê o schema, não liga à BD — valor fictício chega para o install.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes unitários (vitest)
        run: npm test
